name: stress
# The battery against real repos — on demand, and weekly so grammar or
# upstream drift is noticed by a bot before a user.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python stress/run.py /tmp/stress
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stress-report
          path: stress/REPORT.md
