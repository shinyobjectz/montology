name: check
on:
  push: {branches: [main]}
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m compileall -q .monty && echo "syntax ok"
      - run: uv run python -c "import json; json.load(open('.plugin/plugin.json')); json.load(open('.plugin/mcp.json'))"
      - run: uv run monty lint
      - run: uv run pytest tests -q
