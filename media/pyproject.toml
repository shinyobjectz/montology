[project]
name = "montology-media"
version = "0.1.0"
description = "Content encoding and conversion: images via Pillow, audio/video via an invoked ffmpeg, data-URI inlining."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/socialite-ml/montology"
