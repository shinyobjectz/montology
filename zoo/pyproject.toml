[project]
name = "montology-zoo"
version = "0.1.0"
description = "Embedding models from HuggingFace, run locally — a registry, a downloader, one embed() call."
requires-python = ">=3.12"
dependencies = ["huggingface-hub", "httpx"]

[project.optional-dependencies]
onnx = ["onnxruntime", "tokenizers"]
gguf = ["llama-cpp-python"]
# Topic DISCOVERY (BERTopic/KeyBERT) is library-shaped, not weights-shaped:
# both compose over the zoo's carried embedders — the lane is an extra, not
# a model row.
topics = ["bertopic", "keybert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
