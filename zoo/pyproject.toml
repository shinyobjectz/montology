[project]
name = "montology-zoo"
version = "0.1.0"
description = "Embedding models from HuggingFace, run locally — a registry, a downloader, one embed() call."
requires-python = ">=3.12"
dependencies = ["huggingface-hub"]

[project.optional-dependencies]
onnx = ["onnxruntime", "tokenizers"]
gguf = ["llama-cpp-python"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
