[project]
name = "montology-workspace"
version = "0.1.0"
description = "The ontology context layer for any monorepo — the workspace root. The CLI verb is `monty`."
requires-python = ">=3.12"
dependencies = [
    "montology",
    "montology-core",
    "montology-ontology",
    "montology-scan",
    "montology-gen",
]

[tool.uv.workspace]
members = [
    ".monty/core",
    ".monty/cli",
    ".monty/onto",
    ".monty/scan",
    ".monty/gen",
]

[tool.uv.sources]
montology = { workspace = true }
montology-core = { workspace = true }
montology-ontology = { workspace = true }
montology-scan = { workspace = true }
montology-gen = { workspace = true }

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
