[project]
name = "montology-workspace"
version = "0.1.0"
description = "Marketing + monorepo + ontology — the workspace root. Install the CLI: `uvx montology`."
requires-python = ">=3.12"
dependencies = [
    "montology",
    "montology-ontology",
    "montology-zoo",
    "montology-server",
    "montology-dataforseo",
    "montology-scrapecreators",
    "montology-crawl",
    "montology-warehouse",
    "montology-gen",
    "montology-media",
]

[project.optional-dependencies]
# passthrough to the zoo's lanes so `uv sync --extra …` works at the root
topics = ["montology-zoo[topics]"]
audio = ["montology-zoo[audio]"]
science = ["montology-warehouse[science]"]
gguf = ["montology-zoo[gguf]"]

[tool.uv.workspace]
members = [
    "cli",
    "ontology",
    "zoo",
    "server",
    "tools/dataforseo",
    "tools/scrapecreators",
    "tools/crawl",
    "warehouse",
    "gen",
    "media",
]

[tool.uv.sources]
montology = { workspace = true }
montology-ontology = { workspace = true }
montology-zoo = { workspace = true }
montology-server = { workspace = true }
montology-dataforseo = { workspace = true }
montology-scrapecreators = { workspace = true }
montology-crawl = { workspace = true }
montology-warehouse = { workspace = true }
montology-gen = { workspace = true }
montology-media = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
# The root is a virtual aggregator; the packages are the products.
bypass-selection = true
