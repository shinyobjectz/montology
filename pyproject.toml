[project]
name = "montology-workspace"
version = "0.1.0"
description = "Marketing + monorepo + ontology — the workspace root. The CLI verb is `monty`."
requires-python = ">=3.12"
dependencies = [
    "montology",
    "montology-core",
    "montology-ontology",
    "montology-zoo",
    "montology-dataforseo",
    "montology-scrapecreators",
    "montology-crawl",
    "montology-warehouse",
    "montology-gen",
    "montology-media",
]

[project.optional-dependencies]
topics = ["montology-zoo[topics]"]
audio = ["montology-zoo[audio]"]
gguf = ["montology-zoo[gguf]"]
science = ["montology-warehouse[science]"]

[tool.uv.workspace]
members = [
    ".monty/core",
    ".monty/cli",
    ".monty/onto",
    ".monty/zoo",
    ".monty/warehouse",
    ".monty/gen",
    ".monty/media",
    ".monty/tools/dataforseo",
    ".monty/tools/scrapecreators",
    ".monty/tools/crawl",
]
# projects/ are the USERS' uv workspaces — engagements, never members here

[tool.uv.sources]
montology = { workspace = true }
montology-core = { workspace = true }
montology-ontology = { workspace = true }
montology-zoo = { workspace = true }
montology-dataforseo = { workspace = true }
montology-scrapecreators = { workspace = true }
montology-crawl = { workspace = true }
montology-warehouse = { workspace = true }
montology-gen = { workspace = true }
montology-media = { workspace = true }

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
