[project]
name = "montology-warehouse"
version = "0.1.0"
description = "The analytical lane: DuckDB over the user's marketing data, with the registries attached."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["duckdb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/socialite-ml/montology"
Repository = "https://github.com/socialite-ml/montology"
