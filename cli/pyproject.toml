[project]
name = "montology"
version = "0.1.0"
description = "The montology CLI: install data, check the vocabulary, pull models, serve MCP."
requires-python = ">=3.12"
dependencies = [
    "typer",
    "montology-ontology",
    "montology-zoo",
    "montology-server",
]

[project.scripts]
montology = "montology_cli.main:app"

[tool.uv.sources]
montology-ontology = { workspace = true }
montology-zoo = { workspace = true }
montology-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# project name `montology` ≠ package dir `montology_cli`; hatchling needs telling
packages = ["src/montology_cli"]
