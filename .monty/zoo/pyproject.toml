[project]
name = "montology-zoo"
version = "0.1.0"
description = "Small models for marketing work, run on YOUR laptop: registry, downloader, embed(), transcribe(), topics."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "montology-core",
    "huggingface-hub",
    "httpx",
    # the runtime the README promises: embed() works out of the box
    "onnxruntime",
    "tokenizers",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
audio = ["soundfile"]
gguf = ["llama-cpp-python"]
# Topic DISCOVERY (BERTopic/KeyBERT) is library-shaped, not weights-shaped:
# both compose over the zoo's carried embedders — the lane is an extra, not
# a model row.
topics = ["bertopic", "keybert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/socialite-ml/montology"
Repository = "https://github.com/socialite-ml/montology"

[tool.uv.sources]
montology-core = { workspace = true }
