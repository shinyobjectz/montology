[project]
name = "montology-canvas"
version = "0.2.0"
description = "The ontology on a canvas: the vocabulary and the code it governs as one graph, served locally for building, writing and reviewing."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["montology-core", "montology-ontology", "montology-scan"]

[tool.uv.sources]
montology-core = { workspace = true }
montology-ontology = { workspace = true }
montology-scan = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montology_canvas"]

[project.urls]
Homepage = "https://github.com/shinyobjectz/montology"
