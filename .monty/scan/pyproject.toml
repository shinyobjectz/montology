[project]
name = "montology-scan"
version = "0.1.0"
description = "The multiast sweep: tree-sitter declarations per language, checked against the vocabulary; ast-grep invoked for structural search."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "montology-core",
    "montology-ontology",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack",
]

[tool.uv.sources]
montology-core = { workspace = true }
montology-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montology_scan"]
