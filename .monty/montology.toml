name = "montology"
created = "2026-08-10"
engine = "git+https://github.com/shinyobjectz/montology@main#subdirectory=.monty/cli"

[scan]
# montology's own source lives under the (hidden) marker — include it
include = [".monty"]
enforced_kinds = ["core", "inner"]
collisions = "enforce"  # the socialite culture — strangers default to advisory
# The exceptions moved into the database on 2026-08-13 (`monty onto except`),
# where they carry the reason and the paths they hold in. They are seeded with
# the words — see EXCEPTIONS in .monty/onto/src/montology_ontology/seed.py —
# and read with `monty onto except`. This list is the old reasonless form.
allow = []

# WHAT THE SCAN MUST NOT READ. The canvas bundle is GENERATED, minified build
# output — its identifiers are the compiler's, not ours, and a minifier will
# happily name a method after any word we have. The sources it is built from
# (canvas/src) ARE read, which is where a real collision would live. Generated
# output is not vocabulary, for the same reason vendors are not.
exclude = [
  ".monty/canvas/src/montology_canvas/static/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/*.min.js",
]
