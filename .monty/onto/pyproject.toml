[project]
name = "montology-ontology"
version = "0.1.0"
description = "A repo's vocabulary as a database: words, codes, doctrine, rulings — one SQLite file."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["montology-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/socialite-ml/montology"
Repository = "https://github.com/socialite-ml/montology"

[tool.uv.sources]
montology-core = { workspace = true }
