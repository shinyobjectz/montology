[project]
name = "montology-warehouse"
version = "0.1.0"
description = "The analytical lane: DuckDB over the user's marketing data, with the registries attached."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["duckdb"]

[project.optional-dependencies]
# THE RULED SCIENCE STACK — chosen like the zoo chooses models: wheels on
# every OS, no compile on a marketer's laptop, one job each.
#   polars        the in-Python frame; DuckDB<->polars is zero-copy Arrow
#   scipy         tests and bootstrap intervals — uncertainty is mandatory
#   statsmodels   regression + seasonality (MMM-lite, decomposition)
#   scikit-learn  segmentation over zoo embeddings; churn/LTV baselines
#   plotly        charts as SELF-CONTAINED HTML -> mcp-ui artifacts
# Ruled OUT: pandas (polars is the one frame — two frame idioms is drift),
# prophet (cmdstan compile), pymc (overkill until a real Bayesian need),
# lifetimes (unmaintained; BG/NBD via statsmodels when CLV work lands).
science = ["polars", "scipy", "statsmodels", "scikit-learn", "plotly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/socialite-ml/montology"
Repository = "https://github.com/socialite-ml/montology"
