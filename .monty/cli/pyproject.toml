[project]
name = "montology"
version = "0.1.0"
description = "The montology CLI: install data, check the vocabulary, pull models, serve MCP."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "montology-ontology",
    "montology-zoo",
        "montology-warehouse",
    "montology-gen",
    "montology-crawl",
    "montology-media",
    "fastmcp",
    "mcp-ui-server",
]

[project.scripts]
monty = "montology_cli.main:app"
montology = "montology_cli.main:app"  # long-form alias; `monty` is the verb
montology-mcp = "montology_cli.mcp_server:main"  # what .plugin/mcp.json runs

[tool.uv.sources]
montology-ontology = { workspace = true }
montology-zoo = { workspace = true }
montology-warehouse = { workspace = true }
montology-gen = { workspace = true }
montology-crawl = { workspace = true }
montology-media = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# project name `montology` ≠ package dir `montology_cli`; hatchling needs telling
packages = ["src/montology_cli"]

[project.urls]
Homepage = "https://github.com/socialite-ml/montology"
Repository = "https://github.com/socialite-ml/montology"
