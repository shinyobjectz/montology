[project]
name = "montology"
version = "0.2.0"
description = "The montology CLI (`monty`): an ontology context layer for any monorepo — check, scan, lint, sync, serve."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "montology-core",
    "typer",
    "rich",
    "montology-ontology",
    "montology-scan",
    "montology-gen",
    "fastmcp",
]

[project.optional-dependencies]
semantics = ["montology-ontology[semantics]"]

[project.scripts]
monty = "montology_cli.main:run"
montology = "montology_cli.main:run"  # long-form alias; `monty` is the verb
montology-mcp = "montology_cli.mcp_server:main"  # what .plugin/mcp.json runs

[tool.uv.sources]
montology-core = { workspace = true }
montology-ontology = { workspace = true }
montology-scan = { workspace = true }
montology-gen = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# project name `montology` ≠ package dir `montology_cli`; hatchling needs telling
packages = ["src/montology_cli"]

[project.urls]
Homepage = "https://github.com/shinyobjectz/montology"
Repository = "https://github.com/shinyobjectz/montology"
